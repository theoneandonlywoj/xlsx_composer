name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Only a superseded pull request run is cancelled; main runs always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  release-automation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make release-test

  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-beam
      - run: mix deps.unlock --check-unused

  compile:
    needs: dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-beam
      - run: mix compile --force --warnings-as-errors
        env:
          MIX_ENV: dev
      - run: mix compile --force --warnings-as-errors
        env:
          MIX_ENV: test

  static-code-analysis:
    needs: dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-beam
        with:
          plt: "true"
      # Warning-fatal compilation, formatting, strict Credo and Dialyzer.
      - run: make quality
      - run: mix docs --warnings-as-errors

  package:
    needs: dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-beam
      # Builds the Hex package and compiles it as a fresh host's only dependency.
      - run: scripts/package_check.sh

  mix-test:
    needs: dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-beam
      - run: mix test

  # Advisory only: the report goes to the job summary and never fails CI.
  outdated-dependencies:
    needs: dependencies
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-beam
      - name: Report outdated dependencies
        run: |
          {
            echo "## Outdated dependencies (advisory)"
            echo '```'
            mix hex.outdated 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
